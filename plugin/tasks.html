<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><style>body{margin:0;background:#292929;color:#f2f2f2;font:13px "Segoe UI","Microsoft YaHei",sans-serif}p{font-size:12px;color:#ccc;line-height:18px;margin:6px 0}.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:8px}.result{width:auto!important}.result img{width:100%!important}.result button{margin:2px;font-size:11px}.result{width:128px;background:#353535;border:1px solid #666;border-radius:4px;padding:4px}.result img{width:118px;height:86px;object-fit:contain;cursor:pointer}.result span{display:block;font-size:11px;padding:3px}button{background:#414141;color:white;border:1px solid #666;border-radius:3px;padding:6px;cursor:pointer}.error{color:#ffb6b6}.history{border-bottom:1px solid #555;padding:8px 0;margin-bottom:10px}.history div{display:flex;justify-content:space-between;gap:8px;margin:4px 0}.history .open{flex:1;text-align:left}.loading{display:flex;align-items:center;gap:10px;padding:14px;background:#333;border:1px solid #555;border-radius:4px}.spinner{width:18px;height:18px;border:2px solid #666;border-top-color:#bbb;border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}small{color:#ccc}.result{position:relative;padding:4px}.result .zoom{position:absolute;top:6px;right:6px;width:24px;height:24px;padding:0;margin:0;background:#222c;font-size:16px}.result img{cursor:pointer}.result .label{cursor:pointer}#viewer{display:none;position:fixed;inset:0;background:#252525;z-index:10;flex-direction:column;padding:8px}#viewer img{width:100%;height:380px;object-fit:contain}#viewer .toolbar{display:flex;justify-content:space-between;padding:6px}#context{display:none;position:fixed;background:#414141;border:1px solid #777;padding:4px;z-index:20}</style></head><body><div id="history"></div><div id="content"></div><div id="viewer"><div class="toolbar"><button id="close-viewer">关闭</button><button id="download-viewer">下载原图</button></div><img id="large-image"><small id="large-size"></small></div><div id="context"><button id="context-save">保存原图</button></div><script>
function send(data){window.uxpHost?.postMessage(JSON.stringify(data));}let signature='',viewing=null,contextResult=null;function expand(result,action){viewing=action;document.getElementById('large-image').src=result.source;document.getElementById('viewer').style.display='flex';send({type:'taskHeight',height:500});}document.getElementById('close-viewer').onclick=()=>{viewing=null;document.getElementById('viewer').style.display='none';send({type:'taskHeight',height:document.getElementById('content').scrollHeight+8});};document.getElementById('download-viewer').onclick=()=>send({...viewing,type:'save'});document.getElementById('large-image').onload=event=>{document.getElementById('large-size').textContent=event.target.naturalWidth+' × '+event.target.naturalHeight+' · 原图预览';};document.getElementById('context-save').onclick=()=>{send({...contextResult,type:'save'});document.getElementById('context').style.display='none';};document.addEventListener('click',()=>document.getElementById('context').style.display='none');
function render(data){const history=document.getElementById('history'),content=document.getElementById('content');history.replaceChildren();content.replaceChildren();if(data.historyOpen){history.className='history';for(const job of data.jobs){const row=document.createElement('div'),open=document.createElement('button'),del=document.createElement('button');open.className='open';open.textContent=job.title+' · '+(job.state==='ready'?'已完成':job.state==='running'?'生成中':job.state==='submitting'?'提交中':job.state==='uncertain'?'提交未确认':'失败');open.onclick=()=>send({type:'openJob',jobId:job.id});del.textContent='删除';del.onclick=()=>send({type:'deleteJob',jobId:job.id});row.append(open,del);history.append(row);}if(!data.jobs.length)history.textContent='暂无历史记录。';}else history.className='';
const job=data.jobs.find(j=>j.id===data.selectedJobId);if(job){const pending=job.tasks.some(t=>t.state==='running')||job.state==='submitting';if(pending){const loading=document.createElement('div');loading.className='loading';loading.innerHTML='<div class="spinner"></div><div>生成中<small style="display:block">可以新建另一处改图，完成后回到历史查看。</small></div>';content.append(loading);}if(job.error){const error=document.createElement('p');error.className='error';error.textContent=job.error;content.append(error);}let total=0;const gallery=document.createElement('div');gallery.className='results';for(const task of job.tasks){if(task.error){const error=document.createElement('p');error.className='error';error.textContent=task.error;content.append(error);}const results=document.createElement('div');results.className='results';task.results.forEach((result,index)=>{total++;const card=document.createElement('div');card.className='result';const img=document.createElement('img');img.src=result.source;const label=document.createElement('span');label.textContent=result.imported?'再次添加图层':'使用按钮添加图层';img.onload=()=>{label.textContent=img.naturalWidth+' × '+img.naturalHeight+' · '+(result.imported?'点击再次添加':'点击添加');};img.onerror=()=>{label.textContent='预览加载失败，可保存原图';};const action={jobId:job.id,taskId:task.id,index};img.onclick=()=>{send({...action,type:'import'});};card.oncontextmenu=event=>{event.preventDefault();contextResult=action;const menu=document.getElementById('context');menu.style.left=Math.min(event.clientX,window.innerWidth-105)+'px';menu.style.top=Math.min(event.clientY,window.innerHeight-35)+'px';menu.style.display='block';};const preview=document.createElement('button');preview.className='zoom';preview.title='放大查看';preview.setAttribute('aria-label','放大查看');preview.textContent='⤢';preview.onclick=event=>{event.stopPropagation();expand(result,action);};const apply=document.createElement('button');apply.textContent=result.imported?'已添加':'添加图层';apply.disabled=false;apply.onclick=()=>send({type:'import',jobId:job.id,taskId:task.id,index});const save=document.createElement('button');save.textContent='保存原图';save.onclick=()=>send({type:'save',jobId:job.id,taskId:task.id,index});label.className='label';label.textContent=result.imported?'已添加图层':'点击图片添加图层';label.onclick=img.onclick;card.append(img,label,preview);gallery.append(card);});}content.append(gallery);if(!pending && total){const p=document.createElement('p');p.textContent='生成完成。选择候选图，点击添加图层。';content.prepend(p);}if(!pending&&!total){const p=document.createElement('p');p.textContent='尚无生成结果。';content.append(p);}}send({type:'taskHeight',height:viewing?500:document.body.scrollHeight+8});}
window.addEventListener('message',e=>{let data=e.data;try{if(typeof data==='string')data=JSON.parse(data);}catch(_){return;}if(data.type==='jobs'){const next=JSON.stringify(data);if(signature!==next){signature=next;render(data);}}});send({type:'tasksReady'});
</script></body></html>
