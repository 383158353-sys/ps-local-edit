<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#222;font:13px "Microsoft YaHei",sans-serif;display:flex;flex-direction:column;height:100vh;overflow:hidden}.header{display:flex;align-items:center;justify-content:space-between;height:43px;min-height:43px;padding:0 12px;border-bottom:1px solid #ddd;font-weight:bold}.toolbar{display:flex;gap:5px;align-items:center;flex-wrap:wrap;padding:7px 8px;border-bottom:1px solid #ddd}button{background:#f5f5f5;color:#333;border:1px solid #ddd;border-radius:5px;min-width:32px;height:30px;cursor:pointer}button.active{background:#111;color:#fff;border-color:#111}.header button{font-size:18px;border:0;background:#fff}.spacer{flex:1}.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:auto;padding:8px;background:#f2f2f2}canvas{max-width:100%;max-height:100%;object-fit:contain;touch-action:none;background:#fff;cursor:crosshair}.footer{display:flex;align-items:center;justify-content:space-between;min-height:48px;padding:7px 10px;border-top:1px solid #ddd}#notice{color:#666;font-size:11px;line-height:16px}#save{background:#111;color:#fff;border-color:#111;padding:0 13px;white-space:nowrap}#text-entry{width:82px;background:#fff;color:#222;border:1px solid #ddd;border-radius:3px;padding:5px}input[type=color]{width:30px;height:30px;padding:0;border:0;background:transparent}
</style></head><body><div class="header"><span>标注参考图</span><button id="cancel" title="关闭" aria-label="关闭">×</button></div><div class="toolbar"><button data-tool="circle" title="画圆圈">◯ 圆圈</button><button data-tool="arrow" class="active" title="画箭头">↗ 箭头</button><button data-tool="pen" title="画笔">✎ 画笔</button><button data-tool="text" title="添加文字">T 文字</button><input id="text-entry" placeholder="标注文字" aria-label="标注文字"><input id="color" type="color" value="#ff4040" title="颜色"><span class="spacer"></span><button id="undo" title="撤销">↶ 撤销</button><button id="clear" title="清空标注">清空</button></div><div class="stage"><canvas id="canvas"></canvas></div><div class="footer"><div id="notice">拖动画箭头、圆圈或画笔；文字工具点击图片放置文字。</div><button id="save">✓ 完成标注</button></div><script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),color=document.getElementById('color');let base=null,tool='arrow',marks=[],draft=null,start=null,painting=false;
function send(message){if(window.uxpHost)window.uxpHost.postMessage(JSON.stringify(message));else window.parent.postMessage(message,'*')}
function point(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}}
function draw(mark){if(!mark)return;ctx.strokeStyle=mark.color;ctx.fillStyle=mark.color;ctx.lineWidth=Math.max(3,canvas.width/250);ctx.lineCap='round';ctx.lineJoin='round';const a=mark.a,b=mark.b||a;if(mark.tool==='text'){ctx.font=`bold ${Math.max(24,canvas.width/28)}px sans-serif`;ctx.fillText(mark.text,a.x,a.y);return}ctx.beginPath();if(mark.tool==='pen'){const points=mark.points||[a,b];ctx.moveTo(points[0].x,points[0].y);for(const p of points.slice(1))ctx.lineTo(p.x,p.y)}else if(mark.tool==='circle'){ctx.ellipse((a.x+b.x)/2,(a.y+b.y)/2,Math.max(1,Math.abs(b.x-a.x)/2),Math.max(1,Math.abs(b.y-a.y)/2),0,0,Math.PI*2)}else{ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y)}ctx.stroke();if(mark.tool==='arrow'){const angle=Math.atan2(b.y-a.y,b.x-a.x),len=Math.max(18,canvas.width/35);ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x-len*Math.cos(angle-.5),b.y-len*Math.sin(angle-.5));ctx.moveTo(b.x,b.y);ctx.lineTo(b.x-len*Math.cos(angle+.5),b.y-len*Math.sin(angle+.5));ctx.stroke()}}
function render(){if(!base)return;ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(base,0,0);marks.forEach(draw);draw(draft)}
document.querySelectorAll('[data-tool]').forEach(button=>button.onclick=()=>{tool=button.dataset.tool;document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('active',b===button))});
canvas.addEventListener('pointerdown',e=>{if(!base)return;const p=point(e);if(tool==='text'){const value=document.getElementById('text-entry').value.trim();if(value){marks.push({tool,color:color.value,a:p,text:value.slice(0,100)});render()}return}start=p;draft={tool,color:color.value,a:p,b:p,points:[p]};painting=true;canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!painting)return;const p=point(e);draft.b=p;if(tool==='pen')draft.points.push(p);render()});
function finish(){if(!painting)return;painting=false;if(draft)marks.push(draft);draft=null;render()}canvas.addEventListener('pointerup',finish);canvas.addEventListener('pointercancel',()=>{painting=false;draft=null;render()});
document.getElementById('undo').onclick=()=>{marks.pop();render()};document.getElementById('clear').onclick=()=>{marks=[];render()};document.getElementById('cancel').onclick=()=>send({type:'cancel'});document.getElementById('save').onclick=()=>{if(base)send({type:'save',image:canvas.toDataURL('image/png')})};
window.addEventListener('message',e=>{let msg=e.data;try{if(typeof msg==='string')msg=JSON.parse(msg)}catch(_){return}if(msg?.type!=='open'||typeof msg.image!=='string')return;const image=new Image();image.onload=()=>{base=image;canvas.width=image.naturalWidth;canvas.height=image.naturalHeight;marks=[];draft=null;render();send({type:'opened'})};image.src=msg.image});send({type:'ready'});
</script></body></html>
